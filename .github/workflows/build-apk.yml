name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Generate Android project and sync assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../UKMPPD-Active-Mastery.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UKMPPD-Active-Mastery-APK
          path: UKMPPD-Active-Mastery.apk
          retention-days: 30

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y || true
          git push origin :refs/tags/latest || true
          gh release create latest UKMPPD-Active-Mastery.apk \
            --title "UKMPPD Active Mastery (Auto-Build)" \
            --notes "Build otomatis terbaru. Tap UKMPPD-Active-Mastery.apk untuk langsung download & install di HP Android."
