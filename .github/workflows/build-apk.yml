name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build web assets
        run: npm run build

      - name: Restore consistent Android signing keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - name: Generate Android project and patch version
        run: |
          npx cap add android
          python3 scripts/patch_android.py "$APP_VERSION"
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "../StudyPro-v${APP_VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "../StudyPro-latest.apk"

      - name: Generate version.json metadata
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          ver = os.environ["APP_VERSION"]
          meta = {
              "version": ver,
              "downloadUrl": f"https://github.com/MiniCookieWolf/notes-sync-7f3a9c/releases/download/v{ver}/StudyPro-v{ver}.apk",
              "notes": f"Pembaruan Study Pro v{ver} — unduh update APK langsung via browser untuk pemasangan yang lebih stabil.",
              "publishedAt": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, indent=2)
          EOF

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyPro-APK-v${{ env.APP_VERSION }}
          path: StudyPro-v${{ env.APP_VERSION }}.apk
          retention-days: 30

      - name: Publish Versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${APP_VERSION}"
          gh release delete "$TAG" -y || true
          git push origin ":refs/tags/${TAG}" || true
          gh release create "$TAG" "StudyPro-v${APP_VERSION}.apk" "StudyPro-latest.apk" version.json \
            --title "Study Pro ${TAG}" \
            --notes "Pembaruan aplikasi Study Pro ${TAG}. Unduh file APK dan install pembaruan di perangkat Anda."
